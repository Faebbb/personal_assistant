[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-cli"
version = "1.1.0"
description = "CLI personal assistant for contacts, birthdays, notes and tags"
requires-python = ">=3.9"

[project.scripts]
personal-assistant = "personal_assistant.main:main"
